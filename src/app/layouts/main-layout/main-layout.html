<main>
    <uoh-sidebar
        [title]="appTitle()"
        [items]="menuItems()"
        [offcanvasId]="offcanvasId"
    />

    <section class="content">
        <div class="background"></div>
        <uoh-header
            [title]="headerTitle()"
            [subTitle]="headerSubTitle()"
            [menuItems]="menuItems()"
            [menuIcons]="menuIcons()"
            [offcanvasId]="offcanvasId"
            [user]="authService.currentUser()"
            (logout)="onLogout()"
        />
        <article class="container-fluid p-4">
            <router-outlet/>
        </article>
    </section>
</main>
