<button
  class="btn uoh-btn btn-principal"
  [class.uoh-btn--icon]="isIconOnly()"
  [class.uoh-btn--add]="action() === 'add'"
  [class.uoh-btn--edit]="action() === 'edit'"
  [class.uoh-btn--delete]="action() === 'delete'"
  [class.uoh-btn--next]="action() === 'next'"
  [class.uoh-btn--prev]="action() === 'prev'"
  [class.uoh-btn--info]="action() === 'info'"
  [class.uoh-btn--sm]="size() === 'sm'"
  [class.uoh-btn--md]="size() === 'md'"
  [class.uoh-btn--lg]="size() === 'lg'"
  [class.uoh-btn--xl]="size() === 'xl'"
  [style.width]="!isPresetSize() ? size() : null"
  [style.height]="!isPresetSize() ? size() : null"
>
  @if (iconPosition() === 'left') {
    <i class="fa-solid fa-fw me-2" [class]="iconClass()"></i>
  }

  <span>
    <ng-content></ng-content>
  </span>

  @if (iconPosition() === 'right') {
    <i class="ms-2 fa-solid fa-fw" [class]="iconClass()"></i>
  }
</button>
