<section class="sgi-home-page">
  <div class="card pattern color-border mt-4">
    <div class="p-3 p-md-4">
      <div class="quick-links">
        <a routerLink="/mantenedor-proyectos" class="quick-link-card">
          <h2>Mantenedor de proyectos</h2>
          <p>Sandbox inicial para validar componentes standalone y estado con signals.</p>
        </a>
      </div>

      <div class="card mt-4 p-3">
        <label for="sandbox-user-select" class="form-label fw-semibold">
          Prueba de integración <code>&lt;uoh-user-select&gt;</code> (uoh-ui + ng-select 24.0.2)
        </label>
        <uoh-user-select
          labelForId="sandbox-user-select"
          placeholder="Seleccione persona de prueba"
          [users]="sampleUsers()"
          [ngModel]="selectedUserId()"
          (ngModelChange)="selectedUserId.set($event)"
        />
      </div>
    </div>
  </div>
</section>
