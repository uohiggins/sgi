<main id="login">
    <section>
        <img src="assets/img/logos/uoh_logo_horizontal_blanco.svg" alt="Logo UOH" class="logo-uoh" />
    </section>
    <section>
        <article class="mb-4">
            <img src="assets/img/logos/uoh_logo_horizontal_color.svg" alt="Logo UOH" class="logo-uoh"/>
            <div class="separador"></div>
            <small>{{ appName }}</small>
        </article>

        <h3 class="title">Bienvenido</h3>
        <small class="text-muted d-block mt-3">Para ingresar Inicie sesión en el portal</small>

        <form [formGroup]="userForm" (ngSubmit)="onSubmit()" method="post" class="form-login mt-4">
            <div class="mb-3">
                <label for="email" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="email" formControlName="email" placeholder="usuario@uoh.cl"
                    required autocomplete="username" />
                <i class="fa-solid fa-envelope fa-fw"></i>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" formControlName="password"
                    placeholder="*******" required autocomplete="current-password" />
                <i class="fa-solid fa-lock fa-fw"></i>
                <a (click)="viewPassword()" id="see-pass">
                    <i class="fa-solid fa-eye fa-fw" id="eye"></i>
                    <i class="fa-solid fa-eye-slash fa-fw d-none" id="eyeSlash"></i>
                </a>
            </div>

            <div class="my-3">
                <small class="d-block"><a href="https://ad-reset.uoh.cl/"
                        class="text-decoration-none link-principal">¿Olvidé mi contraseña?</a></small>
            </div>

            <div class="mt-3 d-flex justify-content-between align-items-center gap-4">
                <a href="" class="w-50 btn btn-secondary">Volver</a>
                <button type="submit" class="w-50 btn btn-principal">Acceder
                </button>
            </div>
        </form>
    </section>
</main>
